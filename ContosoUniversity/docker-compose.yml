services:
  contosouniversity:
    image: contosouniversity:latest
    build:
      context: ..
      dockerfile: ContosoUniversity/Dockerfile
    container_name: contosouniversity
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: UTC
      # External SQL Server connection (provided separately - not part of this compose file)
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_NAME: ${DB_NAME:-ContosoUniversity}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
      # Alternatively supply a full connection string (takes precedence):
      # ConnectionStrings__SchoolContext: "Server=...;Database=...;User Id=...;Password=...;TrustServerCertificate=True"
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # aspnet image has no curl/wget; use bash /dev/tcp against the /health endpoint
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
