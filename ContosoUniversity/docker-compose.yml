services:
  contosouniversity:
    image: contosouniversity:latest
    build:
      context: ..
      dockerfile: ContosoUniversity/Dockerfile
    container_name: contosouniversity
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: UTC
      # External SQL Server is provided separately; set these before running
      ConnectionStrings__SchoolContext: "Server=${DB_HOST},${DB_PORT:-1433};Database=${DB_NAME:-ContosoUniversity};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True"
      SKIP_DB_INIT: "${SKIP_DB_INIT:-false}"
    volumes:
      - ./logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
