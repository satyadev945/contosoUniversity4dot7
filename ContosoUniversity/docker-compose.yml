services:
  contosouniversity:
    image: contosouniversity:latest
    build:
      context: ..
      dockerfile: ContosoUniversity/Dockerfile
    container_name: contosouniversity
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - TZ=UTC
      # External PostgreSQL is provided separately (Host=...;Port=5432;Database=...;Username=...;Password=...)
      - ConnectionStrings__SchoolContext=${SCHOOL_CONNECTION_STRING:?Set SCHOOL_CONNECTION_STRING}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
