# Run from the ContosoUniversity module directory:
#   DB_CONNECTION_STRING="Server=...;Database=...;User Id=...;Password=...;" docker compose up --build
services:
  contosouniversity:
    image: contosouniversity:latest
    build:
      context: ..
      dockerfile: ContosoUniversity/Dockerfile
    container_name: contosouniversity
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - TZ=UTC
      # External SQL Server connection (provided separately, not part of this compose file)
      - ConnectionStrings__SchoolContext=${DB_CONNECTION_STRING:-}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    # NOTE: the runtime image has no curl/wget; the application exposes /health on port 8080
    # and is probed by Kubernetes (liveness/readiness/startup) in the AKS deployment.
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
