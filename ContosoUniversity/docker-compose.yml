# Run from the ContosoUniversity directory: docker compose up --build
services:
  contosouniversity:
    image: contosouniversity:latest
    build:
      context: ..
      dockerfile: ContosoUniversity/Dockerfile
    container_name: contosouniversity
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: UTC
      # External SQL Server - provide the real value via shell env or .env file
      ConnectionStrings__SchoolContext: ${SCHOOL_DB_CONNECTION:?Set SCHOOL_DB_CONNECTION}
    volumes:
      - ./config:/app/config:ro
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network

volumes:
  app-logs:

networks:
  app-network:
    driver: bridge
