apiVersion: v1
kind: Secret
metadata:
  name: contosouniversity-secrets
  namespace: {{NAMESPACE}}
  labels:
    app: contosouniversity
type: Opaque
data:
  ConnectionStrings__SchoolContext: {{CONNECTION_STRING_B64}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contosouniversity
  namespace: {{NAMESPACE}}
  labels:
    app: contosouniversity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contosouniversity
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: contosouniversity
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: contosouniversity
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "{{ASPNETCORE_ENVIRONMENT}}"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: TZ
              value: "UTC"
            - name: ConnectionStrings__SchoolContext
              valueFrom:
                secretKeyRef:
                  name: contosouniversity-secrets
                  key: ConnectionStrings__SchoolContext
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
