apiVersion: apps/v1
kind: Deployment
metadata:
  name: contosouniversity
  namespace: {{NAMESPACE}}
  labels:
    app: contosouniversity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contosouniversity
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: contosouniversity
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: contosouniversity
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: TZ
              value: "UTC"
            - name: ConnectionStrings__SchoolContext
              value: "{{CONNECTION_STRING}}"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: "{{APPINSIGHTS_CONNECTION_STRING}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
