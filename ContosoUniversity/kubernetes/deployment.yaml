apiVersion: v1
kind: Secret
metadata:
  name: contosouniversity-secrets
  namespace: contosouniversity
  labels:
    app: contosouniversity
type: Opaque
stringData:
  DB_PASSWORD: "{{DB_PASSWORD}}"
  APPLICATIONINSIGHTS_CONNECTION_STRING: "{{APPLICATIONINSIGHTS_CONNECTION_STRING}}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contosouniversity
  namespace: contosouniversity
  labels:
    app: contosouniversity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contosouniversity
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: contosouniversity
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: contosouniversity
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_NAME
              value: "{{DB_NAME}}"
            - name: DB_USER
              value: "{{DB_USER}}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: contosouniversity-secrets
                  key: DB_PASSWORD
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: contosouniversity-secrets
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
