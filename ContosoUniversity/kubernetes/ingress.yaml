apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contosouniversity-ingress
  namespace: contosouniversity
  labels:
    app: contosouniversity
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  # Add a "host:" entry (and a static IP / managed certificate) once DNS is available.
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: contosouniversity-service
                port:
                  number: 80
