apiVersion: apps/v1
kind: Deployment
metadata:
  name: contosouniversity
  namespace: contosouniversity
  labels:
    app: contosouniversity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contosouniversity
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: contosouniversity
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
      containers:
        - name: contosouniversity
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: TZ
              value: "UTC"
            # Created by scripts/deploy-image.sh (kubectl secret "contosouniversity-secrets")
            - name: ConnectionStrings__SchoolContext
              valueFrom:
                secretKeyRef:
                  name: contosouniversity-secrets
                  key: DB_CONNECTION_STRING
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: contosouniversity-secrets
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
