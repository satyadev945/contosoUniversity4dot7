services:
  contosouniversity:
    image: contosouniversity:latest
    build:
      context: .
      dockerfile: ContosoUniversity/Dockerfile
    container_name: contosouniversity
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # External SQL Server is provided separately - override with your own connection string
      - ConnectionStrings__SchoolContext=${SCHOOL_CONNECTION_STRING:-Server=host.docker.internal;Database=ContosoUniversity;User Id=sa;Password=CHANGE_ME;TrustServerCertificate=True}
      - Logging__LogLevel__Default=Information
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
