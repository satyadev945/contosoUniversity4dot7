services:
  contosouniversity:
    image: contosouniversity:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contosouniversity
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__SchoolContext=${SCHOOL_DB_CONNECTION:?Set SCHOOL_DB_CONNECTION to your SQL Server connection string}
      - Database__AutoInitialize=${DATABASE_AUTOINITIALIZE:-true}
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
