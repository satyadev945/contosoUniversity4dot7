services:
  contoso-university:
    image: contoso-university:latest
    build:
      context: .
      dockerfile: ContosoUniversity/Dockerfile
    container_name: contoso-university
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # External PostgreSQL connection, e.g. Host=<POSTGRES_HOST>;Port=5432;Database=<POSTGRES_DB>;Username=<POSTGRES_USER>;Password=<POSTGRES_PASSWORD> (provided separately)
      - ConnectionStrings__SchoolContext=${SCHOOL_CONNECTION_STRING:?Set SCHOOL_CONNECTION_STRING}
      - Logging__LogLevel__Default=Information
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app-logs:
